# PostgreSQL. Versions 9.3 and up are supported.
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("BIKE_MAINTENANCE_DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("BIKE_MAINTENANCE_DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV["BIKE_MAINTENANCE_DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: bike_maintenance_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: bike_maintenance_test

production:
  <<: *default
  database: bike_maintenance_production
  username: <%= ENV.fetch("BIKE_MAINTENANCE_DATABASE_USERNAME") { "bike_maintenance" } %>
  password: <%= ENV["BIKE_MAINTENANCE_DATABASE_PASSWORD"] %>
